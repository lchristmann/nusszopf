# Nusszopf — production stack for self-hosting.
#
# Image-only: nothing is built here. Start it with
#
#     docker compose up -d
#
# next to a `.env` (copy `.env.production.example`, or run `install.sh`, which also generates the
# secrets). Which release runs is decided by NUSSZOPF_VERSION in that `.env`; to upgrade, change it,
# then `docker compose pull && docker compose up -d` (docs/deployment/operations.md).
#
# Contributors build the same two images from a working copy with
#
#     docker compose -f docker-compose.yaml -f compose.prod.yaml up -d --build
name: nusszopf

x-app-image: &app-image ghcr.io/lchristmann/nusszopf-php-fpm:${NUSSZOPF_VERSION:?Set NUSSZOPF_VERSION in .env to the release you want to run}

x-app: &app
  image: *app-image
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - laravel-storage:/var/www/storage/app

services:
  # Serves the static assets and passes everything else to php-fpm. It is the only service that
  # publishes a port: put your TLS-terminating reverse proxy in front of it (docs/deployment/README.md),
  # and set APP_BIND=127.0.0.1 in .env when the proxy runs on the same host.
  web:
    image: ghcr.io/lchristmann/nusszopf-web:${NUSSZOPF_VERSION:?Set NUSSZOPF_VERSION in .env to the release you want to run}
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"
    depends_on:
      php-fpm:
        condition: service_healthy

  # Applies pending migrations and warms the caches on start (its entrypoint), then serves PHP.
  # The long start period leaves room for a slow migration on upgrade.
  php-fpm:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # Background jobs — search indexing today, e-mail later. A failed job is retried up to 5 times with
  # growing pauses (10 s, 30 s, 1 min, 2 min), then kept in `failed_jobs` (docs/deployment/operations.md).
  queue-worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=5", "--backoff=10,30,60,120", "--max-time=3600"]
    # Healthy while jobs are being processed: the scheduler queues a heartbeat job every minute.
    healthcheck:
      test: ["CMD", "php", "artisan", "nusszopf:health", "--only=queue"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3
    depends_on:
      php-fpm:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "artisan", "nusszopf:health", "--only=scheduler"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3
    depends_on:
      php-fpm:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The search index. It is derived from PostgreSQL and never backed up: after losing it, run
  # `docker compose exec php-fpm php artisan search:reindex`.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?Set MEILISEARCH_KEY in .env (at least 16 characters)}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  laravel-storage:
