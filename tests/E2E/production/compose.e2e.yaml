# P-7 (docs/release/parity/P-07-production-e2e.md): test doubles for running the Playwright suite against the
# production images. Layered on docker-compose.yaml (+ compose.prod.yaml to build) by scripts/prod-e2e.sh; never
# part of what an operator runs.
#
# - mailpit stands in for the operator's SMTP relay (MAIL_HOST=mailpit, MAIL_PORT=1025), and its API lets the specs
#   read the mails that were really sent;
# - locationiq-stub stands in for the LocationIQ API (the same stub as compose.dev.yaml);
# - Meilisearch is published on the host so the recovery spec can wipe the index, as it does in CI.
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${E2E_MAILPIT_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10

  locationiq-stub:
    image: nginx:alpine
    volumes:
      - ${NUSSZOPF_BUILD_CONTEXT:-.}/docker/stubs/locationiq.conf:/etc/nginx/conf.d/default.conf:ro

  meilisearch:
    ports:
      - "127.0.0.1:${E2E_MEILISEARCH_PORT:-17700}:7700"

  php-fpm:
    depends_on:
      mailpit:
        condition: service_healthy
      locationiq-stub:
        condition: service_started
