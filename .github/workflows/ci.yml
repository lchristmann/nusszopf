name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole gate before it publishes anything.
  workflow_call:

env:
  PHP_VERSION: "8.5"

jobs:
  lint:
    name: Formatting (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - uses: ramsey/composer-install@v3
      - run: composer lint:check

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - uses: ramsey/composer-install@v3
      - run: composer larastan

  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    # phpunit.xml pins DB_HOST to the Docker Compose hostname ("postgres").
    # PHPUnit never overrides variables already present in the process
    # environment, so the CI service hosts must be set here, not in .env.
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nusszopf_testing
          POSTGRES_USER: nusszopf
          POSTGRES_PASSWORD: nusszopf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nusszopf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: nusszopf-ci-master-key
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, bcmath, intl, zip, gd, exif, pcntl, redis
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Point the app at the CI services
        run: |
          php artisan config:clear
          {
            echo "DB_DATABASE=nusszopf_testing"
            echo "MEILISEARCH_HOST=http://127.0.0.1:7700"
            echo "MEILISEARCH_KEY=nusszopf-ci-master-key"
            echo "SCOUT_DRIVER=meilisearch"
          } >> .env
      - run: php artisan scout:sync-index-settings
      # Feature tests render pages that use @vite, which needs the manifest.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: composer test

  build-assets:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  production-stack:
    name: Production stack (build images, install, start, check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # scripts/smoke-test.sh: builds both images, installs into a clean directory with install.sh, starts
      # docker-compose.yaml, waits for every healthcheck, and checks pages, assets, /health and search:reindex.
      - run: sh scripts/smoke-test.sh

  production-e2e:
    name: Browser tests against the production images (Playwright)
    runs-on: ubuntu-latest
    needs: [test, build-assets]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # scripts/prod-e2e.sh (phase P-7, docs/release/parity/P-07-production-e2e.md): builds both images, installs
      # docker-compose.yaml with install.sh, adds the test doubles of tests/E2E/production/compose.e2e.yaml (Mailpit as
      # the SMTP relay, the LocationIQ stub) and runs every Playwright project against it from the pinned image.
      - run: sh scripts/prod-e2e.sh
        env:
          PROD_E2E_WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/prod-e2e/
          retention-days: 7

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test, build-assets]
    strategy:
      fail-fast: false
      matrix:
        # `browser` is the engine each Playwright project needs installed. The phone and tablet projects are
        # phase P-5's emulated devices (docs/release/parity/P-05-browsers-devices.md).
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-safari, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: tablet-safari, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Let the search page run out of results quickly
        run: echo "SEARCH_PAGE_SIZE=5" >> .env
      # compose.dev.yaml's meilisearch service only falls back to its default master key
      # (nusszopf-dev-master-key-change-me) through Compose's own `${MEILISEARCH_KEY:-...}` substitution when
      # the variable is empty or unset; .env.example ships MEILISEARCH_KEY empty. php-fpm gets MEILISEARCH_KEY
      # from the same `.env` via `env_file`, which passes the literal (empty) value through with no such
      # fallback. Left as-is, php-fpm's Scout client authenticates with an empty key against a server actually
      # running with the fallback key, so scout:flush/scout:import get rejected for a missing Authorization
      # header. Set to the same value the meilisearch service falls back to, matching E2E_MEILISEARCH_KEY
      # passed to Playwright below.
      - name: Match the dev stack's Meilisearch master key
        run: sed -i "s|^MEILISEARCH_KEY=.*|MEILISEARCH_KEY=nusszopf-dev-master-key-change-me|" .env
      # Before the stack starts: Compose hands `.env` to the containers as environment, and an empty APP_KEY
      # there would win over a key generated into the file afterwards.
      # The containers run as UID/GID from `.env` (default 1000); the runner's user owns the checkout.
      - name: Run the containers as the runner's user
        run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
      - name: Generate the application key
        run: sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
      # compose.dev.yaml mounts node-modules-cache/vendor-cache at node_modules/vendor,
      # both inside the bind-mounted checkout. If those directories don't exist yet (a
      # fresh checkout never has them), Docker creates the mountpoints on the host itself
      # when the containers start, and it does so as root. The runner's own `npm ci`
      # further down then hits EACCES trying to write into a root-owned node_modules.
      # Pre-creating them as the runner user keeps Docker from touching their ownership.
      - name: Create the volume mountpoints so Docker doesn't create them as root
        run: mkdir -p node_modules vendor
      - name: Start the real dev stack
        run: docker compose -f compose.dev.yaml up -d --build workspace web php-fpm queue-worker postgres redis meilisearch mailpit
      - name: Wait for the app to be healthy
        run: |
          timeout 120 sh -c 'until docker compose -f compose.dev.yaml ps php-fpm | grep -q healthy; do sleep 2; done'
      # The dev stack bind-mounts the checkout and keeps vendor/ and node_modules/ in named volumes, which
      # start empty on a CI runner: install the dependencies and build the assets through the workspace
      # service (the volumes are shared with php-fpm and the queue worker) before any artisan command. Run as
      # root: a fresh named volume is root-owned, and the installers must be able to write into it.
      - name: Install dependencies and build the assets
        run: |
          docker compose -f compose.dev.yaml exec -T -u root workspace composer install --no-interaction --prefer-dist
          docker compose -f compose.dev.yaml exec -T -u root workspace npm ci
          docker compose -f compose.dev.yaml exec -T -u root workspace npm run build
      - name: Initialize the application
        run: |
          docker compose -f compose.dev.yaml exec -T php-fpm php artisan migrate --force
          docker compose -f compose.dev.yaml exec -T php-fpm php artisan search:reindex
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          # The search specs that need the stack's page size, a way to wipe the index and the recovery command.
          E2E_SEARCH_PAGE_SIZE: 5
          E2E_MEILISEARCH_URL: http://localhost:7700
          E2E_MEILISEARCH_KEY: nusszopf-dev-master-key-change-me
          E2E_REINDEX_COMMAND: docker compose -f compose.dev.yaml exec -T php-fpm php artisan search:reindex
          # The contact-mail journey checks the message actually arrived, via Mailpit's own JSON API.
          E2E_MAILPIT_URL: http://localhost:8025
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (Playwright screenshots)
    runs-on: ubuntu-latest
    needs: [test, build-assets]
    steps:
      - uses: actions/checkout@v4
      # The same stack preparation as the e2e job (see the comments there).
      - run: cp .env.example .env
      - run: sed -i "s|^MEILISEARCH_KEY=.*|MEILISEARCH_KEY=nusszopf-dev-master-key-change-me|" .env
      - run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
      - run: sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
      - run: mkdir -p node_modules vendor
      - name: Start the real dev stack
        run: docker compose -f compose.dev.yaml up -d --build workspace web php-fpm queue-worker postgres redis meilisearch playwright
      - name: Wait for the app to be healthy
        run: timeout 120 sh -c 'until docker compose -f compose.dev.yaml ps php-fpm | grep -q healthy; do sleep 2; done'
      - name: Install dependencies and build the assets
        run: |
          docker compose -f compose.dev.yaml exec -T -u root workspace composer install --no-interaction --prefer-dist
          docker compose -f compose.dev.yaml exec -T -u root workspace npm ci
          docker compose -f compose.dev.yaml exec -T -u root workspace npm run build
          docker compose -f compose.dev.yaml exec -T -u root playwright npm ci
      # docs/testing/visual-regression.md: the fixed dataset, then every screen at phone, tablet and desktop width
      # against tests/Visual/baselines — screenshots are taken inside the pinned Playwright image, where the
      # baselines were made, so the comparison is exact.
      - name: Seed the visual reference dataset
        run: sh tests/Visual/reseed.sh
      - name: Compare every screen with its baseline
        run: docker compose -f compose.dev.yaml exec -T playwright npx playwright test -c playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            playwright-report-visual/
            test-results/
          retention-days: 7
