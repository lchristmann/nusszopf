# Builds the two production images from a working copy instead of pulling them — for contributors
# and CI. It changes nothing else: the stack is docker-compose.yaml.
#
#     docker compose -f docker-compose.yaml -f compose.prod.yaml up -d --build
#
# NUSSZOPF_VERSION (from `.env`) becomes the tag of the images built and the version they report.
services:
  web:
    build:
      context: ${NUSSZOPF_BUILD_CONTEXT:-.}
      dockerfile: docker/php/Dockerfile
      target: nginx
      args:
        NUSSZOPF_VERSION: ${NUSSZOPF_VERSION}
    pull_policy: never

  php-fpm:
    build:
      context: ${NUSSZOPF_BUILD_CONTEXT:-.}
      dockerfile: docker/php/Dockerfile
      target: php-fpm
      args:
        NUSSZOPF_VERSION: ${NUSSZOPF_VERSION}
    pull_policy: never

  queue-worker:
    pull_policy: never

  scheduler:
    pull_policy: never
