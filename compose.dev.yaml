name: nusszopf-dev

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile
  target: dev
  args:
    PHP_VERSION: "8.5"

x-app-environment: &app-environment
  env_file:
    - .env
  user: "${UID:-1000}:${GID:-1000}"

x-app-volumes: &app-volumes
  - .:/var/www:cached
  - vendor-cache:/var/www/vendor
  - node-modules-cache:/var/www/node_modules

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  php-fpm:
    build: *app-build
    restart: unless-stopped
    <<: *app-environment
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  workspace:
    build: *app-build
    <<: *app-environment
    volumes: *app-volumes
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  queue-worker:
    build: *app-build
    restart: unless-stopped
    <<: *app-environment
    volumes: *app-volumes
    command: ["php", "artisan", "queue:listen", "--tries=3"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  scheduler:
    build: *app-build
    restart: unless-stopped
    <<: *app-environment
    volumes: *app-volumes
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  playwright:
    # Playwright's bundled browsers need glibc; the app's own Alpine-based
    # `workspace` image can't run them reliably. Microsoft's official image
    # is Debian-based with every browser + OS dependency preinstalled, and
    # is dev/CI-only — never part of the application runtime.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /var/www
    environment:
      PLAYWRIGHT_BASE_URL: http://web
    volumes:
      - .:/var/www:cached
      - playwright-node-modules:/var/www/node_modules
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nusszopf}
      POSTGRES_USER: ${DB_USERNAME:-nusszopf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nusszopf}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nusszopf}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-nusszopf-dev-master-key-change-me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "${MEILISEARCH_FORWARD_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  vendor-cache:
  node-modules-cache:
  playwright-node-modules:
