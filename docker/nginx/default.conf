server {
    listen 80;
    server_name _;
    root /var/www/public;

    index index.php;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # robots.txt is generated by the app (it names APP_URL's sitemap).
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    # Uploaded files (avatars) — resolved through the `public/storage`
    # symlink onto the `laravel-storage` volume mounted read-only into this
    # container (docker-compose.yaml, docs/deployment/README.md). Served
    # directly, no PHP round trip; the versioned filename makes a long,
    # immutable cache lifetime safe (a replaced avatar gets a new name).
    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
