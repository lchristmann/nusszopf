[www]
user = nusszopf
group = nusszopf

listen = 9000
listen.owner = nusszopf
listen.group = nusszopf

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

pm.status_path = /status
ping.path = /ping

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
