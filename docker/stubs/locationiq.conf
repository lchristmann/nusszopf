# Dev/CI-only stand-in for the LocationIQ autocomplete API
# (app/Services/LocationSearch.php). Returns a fixed, realistic response for
# any query, so browser tests and local development need neither a LocationIQ
# key nor outbound network access. Never part of the production stack.
server {
    listen 80;

    location /v1/autocomplete.php {
        default_type application/json;
        return 200 '[{"place_id":"stub-1","osm_id":"62649","osm_type":"relation","lat":"51.3406321","lon":"12.3747329","display_place":"Leipzig","display_address":"Sachsen, Deutschland","address":{"name":"Leipzig","postcode":"04109","country_code":"de"}},{"place_id":"stub-2","osm_id":"4500","osm_type":"relation","lat":"51.2000","lon":"12.4000","display_place":"Leipzig-Land","display_address":"Sachsen, Deutschland","address":{"name":"Leipzig-Land","postcode":"04299","country_code":"de"}}]';
    }
}
